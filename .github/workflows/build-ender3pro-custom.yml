name: Build Ender3 Pro 4.2.2 Custom Firmware

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-ender3pro-custom.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout TinyMachines / InsanityAutomation source
        uses: actions/checkout@v4
        with:
          repository: InsanityAutomation/Marlin
          ref: CrealityDwin_2.0
          fetch-depth: 1

      - name: Apply custom configuration
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("Marlin/Configuration.h")
          s = p.read_text(encoding="utf-8")

          def one(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {n}")
              s = s.replace(old, new, 1)
              print("OK:", label)

          # Trianglelab / BMG-style extruder = 415 steps/mm in this TinyMachines source.
          one(
              " //#define BondtechBMG",
              " #define BondtechBMG",
              "E steps = 415"
          )

          # BIQU HT-NTC100K / 100K B3950 high-temp thermistor = Marlin table 61.
          s, n = re.subn(
              r'(#elif ENABLED\(HotendStock\)\s*\n\s*)#define TEMP_SENSOR_0 1',
              r'\1#define TEMP_SENSOR_0 61',
              s,
              count=1
          )
          if n != 1:
              raise SystemExit(f"TEMP_SENSOR_0: expected 1 match, found {n}")
          print("OK: TEMP_SENSOR_0 = 61")

          # Custom BLTouch position on this printhead.
          one(
              "#define NOZZLE_TO_PROBE_OFFSET { -41, -8, 0 }",
              "#define NOZZLE_TO_PROBE_OFFSET { -29, -27, -8.90 }",
              "BLTouch offsets X-29 Y-27 Z-8.90"
          )

          # Permit further Z-offset tuning if required.
          one(
              "#define Z_PROBE_OFFSET_RANGE_MIN -9",
              "#define Z_PROBE_OFFSET_RANGE_MIN -15",
              "Z probe offset minimum = -15"
          )

          # Physical marked center used for safe Z homing.
          one(
              "#define Z_SAFE_HOMING_X_POINT (X_BED_SIZE / 2)  // X point for Z homing",
              "#define Z_SAFE_HOMING_X_POINT 110  // measured physical bed center (probe)",
              "Safe home X = 110"
          )
          one(
              "#define Z_SAFE_HOMING_Y_POINT (Y_BED_SIZE / 2)  // Y point for Z homing",
              "#define Z_SAFE_HOMING_Y_POINT 129  // measured physical bed center (probe)",
              "Safe home Y = 129"
          )

          # Ender 3 / Ender 3 Pro maximum Z height.
          old = """  #elif ANY(MachineEnder3, MachineEnder3V2)
            #define X_BED_SIZE 230
            #define Y_BED_SIZE 230
            #define Z_MAX_POS 250"""
          new = """  #elif ANY(MachineEnder3, MachineEnder3V2)
            #define X_BED_SIZE 230
            #define Y_BED_SIZE 230
            #define Z_MAX_POS 235"""
          # Normalize the eight extra spaces above to match the source indentation.
          old = old.replace("            #", "    #")
          new = new.replace("            #", "    #")
          one(old, new, "Z max = 235")

          required = [
              "#define BondtechBMG",
              "#define TEMP_SENSOR_0 61",
              "#define NOZZLE_TO_PROBE_OFFSET { -29, -27, -8.90 }",
              "#define Z_PROBE_OFFSET_RANGE_MIN -15",
              "#define Z_SAFE_HOMING_X_POINT 110",
              "#define Z_SAFE_HOMING_Y_POINT 129",
              "#define Z_MAX_POS 235",
          ]
          for item in required:
              if item not in s:
                  raise SystemExit("Missing required setting: " + item)

          p.write_text(s, encoding="utf-8")
          print("All requested settings verified.")

      - name: Show key settings
        run: |
          grep -nE "BondtechBMG|EStepsmm 415|TEMP_SENSOR_0 61|NOZZLE_TO_PROBE_OFFSET|Z_PROBE_OFFSET_RANGE_MIN|Z_SAFE_HOMING_[XY]_POINT|Z_MAX_POS 235" Marlin/Configuration.h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Compile Ender3_422_BLT
        run: platformio run -e Ender3_422_BLT

      - name: Collect firmware
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifact
          find .pio/build/Ender3_422_BLT -maxdepth 1 -type f -name "*.bin" -print
          cp .pio/build/Ender3_422_BLT/*.bin artifact/
          cp Marlin/Configuration.h artifact/Configuration.h
          ls -lah artifact

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ender3Pro_422_BLT_BIQU_B3950_E415_Z235
          path: artifact/*
          if-no-files-found: error
