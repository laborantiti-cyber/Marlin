name: Build Ender3 Pro 4.2.2 TinyMachines V5 SAFE

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-ender3pro-tinymachines-v5-safe.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout TinyMachines / InsanityAutomation source
        uses: actions/checkout@v4
        with:
          repository: InsanityAutomation/Marlin
          ref: CrealityDwin_2.0
          fetch-depth: 1

      - name: Apply Ender 3 Pro custom configuration
        shell: python
        run: |
          from pathlib import Path

          cfgp = Path("Marlin/Configuration.h")
          advp = Path("Marlin/Configuration_adv.h")
          cfg = cfgp.read_text(encoding="utf-8")
          adv = advp.read_text(encoding="utf-8")

          def rep_cfg(old, new, label):
              global cfg
              n = cfg.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {n}")
              cfg = cfg.replace(old, new, 1)
              print(f"OK: {label}")

          def rep_adv(old, new, label):
              global adv
              n = adv.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {n}")
              adv = adv.replace(old, new, 1)
              print(f"OK: {label}")

          # Trianglelab / Bondtech BMG style extruder -> TinyMachines gives E415
          rep_cfg(
              " //#define BondtechBMG",
              " #define BondtechBMG",
              "Bondtech BMG / E415"
          )

          # BIQU HT-NTC100K, 100K B3950
          rep_cfg(
              "#elif ENABLED(HotendStock)\n  #define TEMP_SENSOR_0 1\n#endif",
              "#elif ENABLED(HotendStock)\n  #define TEMP_SENSOR_0 61\n#endif",
              "TEMP_SENSOR_0 = 61"
          )

          # Measured BLTouch offsets
          rep_cfg(
              "#define NOZZLE_TO_PROBE_OFFSET { -41, -8, 0 }",
              "#define NOZZLE_TO_PROBE_OFFSET { -29, -27, -8.90 }",
              "BLTouch X-29 Y-27 Z-8.90"
          )

          # Allow adjustment below -9 if needed
          rep_cfg(
              "#define Z_PROBE_OFFSET_RANGE_MIN -9",
              "#define Z_PROBE_OFFSET_RANGE_MIN -15",
              "Z offset minimum -15"
          )

          # IMPORTANT V5 CHANGE:
          # TinyMachines normally executes probe.move_z_after_homing(), and with
          # Z_AFTER_PROBING=5 it forces Z to 5 mm after probe homing.
          # Disable that extra automatic move so G28 ends at the Z coordinate
          # calculated from the BLTouch trigger and probe Z offset.
          rep_cfg(
              "  #define Z_AFTER_PROBING           5 // Z position after probing is done",
              "  //#define Z_AFTER_PROBING           5 // disabled in V5 SAFE",
              "Disable Z_AFTER_PROBING"
          )

          # Safe Z homing point for the measured probe position
          rep_cfg(
              "#define Z_SAFE_HOMING_X_POINT (X_BED_SIZE / 2)  // X point for Z homing",
              "#define Z_SAFE_HOMING_X_POINT 110  // measured probe safe-home point",
              "Safe home X 110"
          )
          rep_cfg(
              "#define Z_SAFE_HOMING_Y_POINT (Y_BED_SIZE / 2)  // Y point for Z homing",
              "#define Z_SAFE_HOMING_Y_POINT 129  // measured probe safe-home point",
              "Safe home Y 129"
          )

          # Z travel
          rep_cfg(
              "  #elif ANY(MachineEnder3, MachineEnder3V2)\n    #define X_BED_SIZE 230\n    #define Y_BED_SIZE 230\n    #define Z_MAX_POS 250",
              "  #elif ANY(MachineEnder3, MachineEnder3V2)\n    #define X_BED_SIZE 230\n    #define Y_BED_SIZE 230\n    #define Z_MAX_POS 235",
              "Z max 235"
          )

          # Keep TinyMachines/Creality normal EEPROM implementation.
          # DO NOT enable FLASH_EEPROM_EMULATION in this V5 build.

          # Always show M500/M501 feedback
          rep_cfg(
              "#if DISABLED(LowMemoryBoard)\n  #define EEPROM_CHITCHAT       // Give feedback on EEPROM commands. Disable to save PROGMEM.\n#endif",
              "#define EEPROM_CHITCHAT       // Give feedback on M500/M501",
              "EEPROM chitchat"
          )

          # M48 repeatability test
          rep_cfg(
              "  //#define Z_MIN_PROBE_REPEATABILITY_TEST",
              "  #define Z_MIN_PROBE_REPEATABILITY_TEST",
              "M48 probe repeatability"
          )

          # LCD Z-offset wizard
          rep_adv(
              "  //#define PROBE_OFFSET_WIZARD       // Add a Probe Z Offset calibration option to the LCD menu",
              "  #define PROBE_OFFSET_WIZARD       // Add a Probe Z Offset calibration option to the LCD menu",
              "Probe Offset Wizard"
          )
          rep_adv(
              "    //#define PROBE_OFFSET_WIZARD_START_Z -4.0",
              "    #define PROBE_OFFSET_WIZARD_START_Z -8.0",
              "Probe Offset Wizard safe start"
          )

          cfgp.write_text(cfg, encoding="utf-8")
          advp.write_text(adv, encoding="utf-8")

          required_cfg = [
              "#define BondtechBMG",
              "#define TEMP_SENSOR_0 61",
              "#define NOZZLE_TO_PROBE_OFFSET { -29, -27, -8.90 }",
              "#define Z_PROBE_OFFSET_RANGE_MIN -15",
              "//#define Z_AFTER_PROBING           5 // disabled in V5 SAFE",
              "#define Z_SAFE_HOMING_X_POINT 110",
              "#define Z_SAFE_HOMING_Y_POINT 129",
              "#define Z_MAX_POS 235",
              "#define EEPROM_SETTINGS",
              "#define EEPROM_CHITCHAT",
              "#define Z_MIN_PROBE_REPEATABILITY_TEST",
              "#define RESTORE_LEVELING_AFTER_G28",
          ]
          required_adv = [
              "#define PROBE_OFFSET_WIZARD",
              "#define PROBE_OFFSET_WIZARD_START_Z -8.0",
              "#define BABYSTEP_ZPROBE_OFFSET",
          ]
          for v in required_cfg:
              if v not in cfg:
                  raise SystemExit(f"Validation failed: {v}")
          for v in required_adv:
              if v not in adv:
                  raise SystemExit(f"Validation failed: {v}")

          print("All V5 SAFE settings validated.")

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Compile Ender3_422_BLT
        run: platformio run -e Ender3_422_BLT

      - name: Collect firmware
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifact
          BIN="$(find .pio/build/Ender3_422_BLT -maxdepth 1 -type f -name '*.bin' | head -n 1)"
          test -n "$BIN"
          cp "$BIN" artifact/Ender3Pro_422_TinyMachines_V5_SAFE_BLTouch_BIQU_B3950_E415_Z235.bin
          cp Marlin/Configuration.h artifact/Configuration.h
          cp Marlin/Configuration_adv.h artifact/Configuration_adv.h
          sha256sum artifact/*.bin | tee artifact/SHA256.txt
          ls -lah artifact

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ender3Pro_422_TinyMachines_V5_SAFE
          path: artifact/*
          if-no-files-found: error
          retention-days: 30
